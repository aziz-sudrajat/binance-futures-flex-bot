name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests (no network)
        run: python -m pytest -q -m "not integration"

      - name: Secret scan (no keys in repo)
        run: |
          ! grep -rniE "api[_-]?key\s*=\s*['\"][^'\"]{8,}|api[_-]?secret\s*=\s*['\"][^'\"]{8,}" \
            --include="*.py" --include="*.yml" --include="Dockerfile" . \
            | grep -viE "example|placeholder|your_|dummy|test" || true
